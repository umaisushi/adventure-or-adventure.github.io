<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>アドベンチャー or アドベンチャ</title>
<style>
:root{--bg:#151226;--bg2:#211c3a;--ink:#1b1730;--cream:#f7f0df;--pink:#ff4f8b;--yel:#ffd23f;--cy:#5de0e6;--mut:#a9a2c7}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);
  font-family:"Hiragino Maru Gothic ProN","Yu Gothic","Meiryo","Noto Sans JP",sans-serif;font-size:15px;line-height:1.6}
body{background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:28px 28px}
#app{max-width:860px;margin:0 auto;padding:14px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}
h1,h2,h3,p{margin:0}
button{font:inherit;font-weight:800;cursor:pointer;border:3px solid var(--ink);background:var(--yel);color:var(--ink);padding:.5em 1.2em;border-radius:999px;box-shadow:0 4px 0 var(--ink);transition:transform .06s,box-shadow .06s}
button:hover{filter:brightness(1.06)}
button:active{transform:translateY(4px);box-shadow:0 0 0 var(--ink)}
button:focus-visible{outline:3px solid var(--cy);outline-offset:2px}
button.pk{background:var(--pink);color:#fff}
button.sub{background:var(--cream);box-shadow:0 3px 0 var(--ink);padding:.3em .8em;font-size:13px}
.center{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
/* title */
.pre{color:var(--cy);font-weight:800;letter-spacing:.2em;font-size:13px}
.logo{font-size:clamp(30px,8vw,64px);font-weight:900;line-height:1.15;color:var(--cream);text-shadow:4px 4px 0 var(--pink)}
.logo span{display:block;font-size:.45em;color:var(--yel);text-shadow:none;letter-spacing:.3em;margin:.1em 0}
.logo i{font-style:normal;color:var(--mut);text-decoration:line-through;text-decoration-color:var(--pink)}
.small{font-size:12px;color:var(--mut);max-width:34em}
select{font:inherit;border:2px solid var(--ink);border-radius:8px;padding:2px 6px;max-width:60vw}
.gens{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:560px}.gens small{margin-left:5px;opacity:.6;font-weight:600}
label.opt{display:inline-flex;gap:8px;align-items:center;background:var(--bg2);padding:6px 14px;border-radius:999px;cursor:pointer}
/* stage + message window */
.stage{position:relative;background:#000;border:4px solid var(--ink);border-radius:14px;overflow:hidden;aspect-ratio:8/5;box-shadow:0 0 0 3px var(--bg2);cursor:pointer}
.stage img{width:100%;height:100%;object-fit:cover;display:block;background:#fff}
.mon{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:clamp(11px,2.2vw,16px);padding:16px;text-align:center;background:#0d1b2a;color:#9fe8a8;font-family:ui-monospace,Menlo,Consolas,monospace}
.mon.nf{background:#f4f4f6;color:#333}
.mon.nf b{font-size:clamp(44px,14vw,110px);line-height:1;color:#c9c9d1;font-weight:900}
.mon.nf strong{font-size:clamp(15px,3.4vw,24px)}
.mon.panic{animation:shake .25s infinite}
@keyframes shake{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,-3px)}}
.frames{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.frames div{width:17%;min-width:70px;aspect-ratio:4/3;border:2px dashed #9fe8a8;display:grid;place-items:center;font-size:12px}
.mw{position:relative;margin-top:-34px;margin-inline:12px;background:var(--cream);color:var(--ink);border:4px solid var(--ink);border-radius:14px;padding:16px 18px 20px;min-height:104px;box-shadow:6px 6px 0 var(--pink);z-index:2;cursor:pointer}
.mw .who{position:absolute;top:-16px;left:14px;background:var(--ink);color:var(--yel);padding:1px 14px;border-radius:999px;font-weight:800;font-size:13px}
.mw p{font-size:clamp(15px,2.6vw,19px);font-weight:700}
.mw .nx{position:absolute;right:14px;bottom:6px;color:var(--pink);animation:bob .8s infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.cap{position:absolute;left:10px;top:10px;background:rgba(27,23,48,.85);color:var(--yel);padding:2px 12px;border-radius:999px;font-size:12px;font-weight:800}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;font-size:clamp(9px,1.9vw,14px);line-height:1.45;color:#222;text-align:left;padding-bottom:38px;overflow:hidden}
.scr.panic{animation:shake .25s infinite}
.cav{width:1.9em;height:1.9em;border-radius:50%;background:#ffd23f;color:#222;display:grid;place-items:center;font-weight:800;flex:none;font-size:.9em}
.chat{background:#93aacb}.chd{background:#2b3a55;color:#fff;padding:.35em .8em;font-weight:700}
.cbody{flex:1;display:flex;flex-direction:column;gap:.4em;padding:.5em .7em;justify-content:flex-end;overflow:hidden}
.cm{display:flex;gap:.4em;align-items:flex-end;max-width:86%}.cm.me{align-self:flex-end}
.bub{background:#fff;border-radius:1em;padding:.25em .75em}.cm.me .bub{background:#8de055}
.cm small{font-size:.72em;color:#fff;min-width:2em;text-align:right}
.csys{align-self:center;background:rgba(0,0,0,.25);color:#fff;border-radius:999px;padding:0 .8em;font-size:.8em}
.drv{background:#f4f6fa}.dhd{background:#fff;border-bottom:1px solid #d5dbe5;padding:.4em .8em;display:flex;gap:.5em;align-items:center;white-space:nowrap}
.dhd span{margin-left:auto;color:#789;font-size:.85em}
.dgrid{display:flex;gap:.6em;padding:.7em;align-items:flex-start;justify-content:center}
.df{flex:1;max-width:19%;background:#fff;border:1px solid #d5dbe5;border-radius:.4em;overflow:hidden}.df svg{display:block;width:100%}
.dn{font-size:.7em;padding:.2em .35em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dnote{margin:0 .7em;background:#fff8d6;border:1px solid #e5d58a;border-radius:.4em;padding:.3em .6em}
.lrow{display:flex;gap:.6em;background:#fff;border-bottom:1px solid #e3e7ee;padding:.35em .8em}.lrow b{margin-left:auto;color:#d22}
.pop{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);background:#fff;border:2px solid #d22;border-radius:.5em;padding:.5em 1em;font-weight:800;color:#d22;box-shadow:0 4px 12px rgba(0,0,0,.25);white-space:nowrap}
.mail{flex-direction:row;background:#fff}
.mside{width:25%;background:#eef1f6;padding:.5em;display:flex;flex-direction:column;gap:.25em}.mside div{padding:.15em .5em;border-radius:.4em}.mside .on{background:#cfdcf5;font-weight:700}
.mmain{flex:1;padding:.6em .9em;display:flex;flex-direction:column;gap:.4em;min-width:0}.msub{font-weight:800;font-size:1.25em}
.mfrom{display:flex;gap:.5em;align-items:center;border-bottom:1px solid #e3e7ee;padding-bottom:.35em}.mfrom small{display:block;color:#789}
.mbody{line-height:1.7}.matt{color:#789;font-size:.9em}
.badge{background:#d22;color:#fff;border-radius:.3em;padding:0 .5em;font-size:.7em;font-weight:700;vertical-align:middle}
.dsk{background:#3d6fa5;align-items:center;justify-content:center}
.win{background:#fff;border-radius:.5em;width:62%;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.35)}.wt{background:#dde3ec;padding:.25em .7em;font-weight:700}
.wb{padding:.6em .9em;display:flex;flex-direction:column;gap:.3em}.pw{border:1px solid #99a;border-radius:.3em;padding:.15em .5em;letter-spacing:.2em}
.wbtn{align-self:flex-end;display:flex;gap:.4em}.wbtn span{border:1px solid #99a;border-radius:.3em;padding:0 .8em}
.docw{background:#8a8f99;align-items:center;padding-top:.7em}
.paper{background:#fff;width:56%;padding:.6em 1em .9em;position:relative;box-shadow:0 3px 10px rgba(0,0,0,.3)}.paper h4{margin:0 0 .2em;text-align:center;font-size:1.3em;letter-spacing:.3em}
.prow{display:flex;justify-content:space-between;border-bottom:1px solid #ccc;padding:.15em 0}
.stamp{position:absolute;right:5%;bottom:10%;border:2px solid #d22;color:#d22;font-weight:800;padding:0 .5em;transform:rotate(-10deg);background:rgba(255,255,255,.85)}
.sns{background:#e9eef5;align-items:center;justify-content:flex-start;padding-top:.6em}
.post{background:#fff;border:1px solid #d5dbe5;border-radius:.6em;width:66%;padding:.5em .8em;display:flex;flex-direction:column;gap:.25em}
.trk{padding:.6em 1.2em;display:flex;flex-direction:column;gap:.45em}
.ts{display:flex;gap:.7em;align-items:center}.ts i{width:.8em;height:.8em;border-radius:50%;background:#b8c2d0;flex:none}.ts b{min-width:6em}
.ts.now i{background:#e33;box-shadow:0 0 0 .25em rgba(238,51,51,.25)}.ts.now{color:#c22}
.nws{background:#16233f;color:#fff;justify-content:center;gap:.4em;padding-left:1em;padding-right:1em}
.nbar{align-self:flex-start;background:#e33;font-weight:800;padding:0 .8em;letter-spacing:.3em}
.nhead{font-size:1.6em;font-weight:900;line-height:1.3}.nsub{opacity:.9}.ntick{background:#ffd23f;color:#111;padding:0 .6em;font-size:.85em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.call{background:#20242c;color:#fff;align-items:center;justify-content:center;gap:.2em;text-align:center}
.cface{width:4.2em;height:4.2em;border-radius:50%;background:#566170;display:grid;place-items:center;font-size:1.6em;font-weight:800;filter:grayscale(1)}
.hang{width:2.2em;height:2.2em;border-radius:50%;background:#e33;display:grid;place-items:center;margin-top:.3em}
.mlab{position:absolute;right:4%;top:8%;background:#fff;border-radius:.5em;padding:.3em .7em;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.qbar{height:1em;background:#dde3ec;border-radius:999px;overflow:hidden}.qbar i{display:block;height:100%;width:100%;background:#d22}
/* brief / panels */
.panel{background:var(--bg2);border:3px solid var(--ink);border-radius:14px;padding:16px}
.tag{display:inline-block;background:var(--pink);color:#fff;font-weight:800;border-radius:999px;padding:0 12px;font-size:13px}
.odai{font-size:clamp(18px,3.6vw,26px);font-weight:900;color:var(--yel);margin:6px 0}
.quote{background:var(--cream);color:var(--ink);border-radius:10px;padding:8px 12px;font-weight:700;margin-top:6px}
.quote b{color:var(--pink);margin-right:6px}
/* draw */
.cvw{position:relative}
#ov{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;border:4px solid transparent;border-radius:12px}
.tw{display:inline-block;background:var(--cy);color:var(--ink);font-weight:800;border-radius:999px;padding:0 10px;font-size:13px}
.sl,.cp{display:inline-flex;gap:6px;align-items:center;font-size:13px;background:var(--bg2);padding:3px 10px;border-radius:999px}
.sl input{width:110px}.sl output{min-width:2.6em;text-align:right;font-variant-numeric:tabular-nums}
.cp input{width:34px;height:26px;padding:0;border:2px solid var(--ink);border-radius:6px;background:none;cursor:pointer}
.lines{margin-top:6px}.lines .quote{padding:4px 10px;font-size:14px;margin-top:4px}
.bar{height:12px;background:var(--ink);border-radius:999px;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:100%;background:var(--cy);transition:width .25s linear}
.bar i.hot{background:var(--pink)}
#cv{width:100%;aspect-ratio:8/5;background:#fff;border:4px solid var(--ink);border-radius:12px;display:block;touch-action:none;cursor:crosshair}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.sw{width:28px;height:28px;border-radius:50%;border:3px solid var(--ink);padding:0;box-shadow:none}
.sw.on{outline:3px solid var(--cy);outline-offset:2px}
.tb{background:var(--cream);box-shadow:0 3px 0 var(--ink);padding:.25em .8em;font-size:13px}
.tb.on{background:var(--cy)}
.sp{flex:1}
/* judge */
.jg{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:640px){.jg{grid-template-columns:1fr}}
.jg img{width:100%;border:4px solid var(--ink);border-radius:12px;background:#fff;display:block}
.score{font-size:64px;font-weight:900;color:var(--yel);line-height:1}
.score small{font-size:18px;color:var(--mut)}
.meter{height:10px;background:var(--ink);border-radius:999px;overflow:hidden;margin:6px 0 10px}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--yel))}
.dots::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"・"}50%{content:"・・"}75%{content:"・・・"}}
/* result */
.aw{background:var(--yel);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:8px 14px;font-weight:700;text-align:center}.aw b{font-size:20px;font-weight:900;margin-left:6px}
.news{background:var(--cream);color:var(--ink);border-radius:12px;padding:12px 16px;border:4px solid var(--ink);box-shadow:6px 6px 0 var(--yel)}
.news small{font-weight:800;color:var(--pink);letter-spacing:.15em}
.news h2{font-size:clamp(18px,4vw,28px);font-weight:900}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.nums div{background:var(--bg2);border:3px solid var(--ink);border-radius:12px;padding:8px;text-align:center}
.nums small{display:block;color:var(--mut);font-size:12px}
.nums b{font-size:clamp(20px,5vw,34px);color:var(--yel);font-weight:900}
.voices{display:grid;gap:8px}
.vo{background:var(--bg2);border-radius:12px;padding:10px 12px;display:flex;gap:10px;border:2px solid rgba(255,255,255,.08);animation:pop .4s both}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:900;color:var(--ink)}
.vo b{font-size:13px}.vo span{color:var(--mut);font-size:12px;margin-left:8px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.gal figure{margin:0;background:var(--bg2);border-radius:10px;overflow:hidden;border:2px solid var(--ink)}
.gal img{width:100%;display:block;background:#fff}
.gal figcaption{padding:5px 8px;font-size:12px}
.gal figcaption b{color:var(--yel)}
h3.sec{margin:18px 0 8px;color:var(--cy);font-size:15px;letter-spacing:.1em}
@media (prefers-reduced-motion:reduce){.mon.panic,.mw .nx,.vo{animation:none}}
</style>
</head>

/* ===== 完成版プレイを GIF アニメにして保存 ===== */
function gifLZW(idx){
  const clear=256,eoi=257,out=[];let size=9,next=258,cur=0,bits=0,table=new Map();
  const emit=c=>{cur|=c<<bits;bits+=size;while(bits>=8){out.push(cur&255);cur>>>=8;bits-=8}};
  emit(clear);let p=idx[0];
  for(let i=1;i<idx.length;i++){const k=idx[i],key=p<<8|k,c=table.get(key);
    if(c!==undefined)p=c;
    else{emit(p);
      if(next===4096){emit(clear);next=258;size=9;table=new Map()}
      else{if(next>=(1<<size))size++;table.set(key,next++)}
      p=k}}
  emit(p);emit(eoi);if(bits>0)out.push(cur&255);
  return out;
}
function gifEncode(W,H,frames){ // frames: [{data:Uint8ClampedArray(RGBA), delay:ms}]
  const parts=[],u8=a=>parts.push(a instanceof Uint8Array?a:new Uint8Array(a));
  const pal=new Uint8Array(768);let n=0;
  for(let r=0;r<6;r++)for(let g=0;g<7;g++)for(let b=0;b<6;b++){pal[n++]=Math.round(r*51);pal[n++]=Math.round(g*42.5);pal[n++]=Math.round(b*51)}
  u8([71,73,70,56,57,97,W&255,W>>8,H&255,H>>8,0xf7,0,0]);u8(pal);
  u8([0x21,0xff,11,78,69,84,83,67,65,80,69,50,46,48,3,1,0,0,0]);
  for(const f of frames){
    const d=f.data,idx=new Uint8Array(W*H);
    for(let i=0,j=0;i<idx.length;i++,j+=4)idx[i]=Math.round(d[j]/51)*42+Math.round(d[j+1]/42.5)*6+Math.round(d[j+2]/51);
    const cs=Math.round(f.delay/10);
    u8([0x21,0xf9,4,0,cs&255,cs>>8,0,0,0x2c,0,0,0,0,W&255,W>>8,H&255,H>>8,0,8]);
    const lz=gifLZW(idx),buf=new Uint8Array(lz.length+Math.ceil(lz.length/255)+1);let o=0;
    for(let i=0;i<lz.length;i+=255){const len=Math.min(255,lz.length-i);buf[o++]=len;for(let k=0;k<len;k++)buf[o++]=lz[i+k]}
    buf[o++]=0;u8(buf.subarray(0,o));
  }
  u8([0x3b]);return new Blob(parts,{type:"image/gif"});
}

      verdict:String(x.verdict||"").slice(0,220),ai:true};
